packages:
  - "."

# @firebase/util and protobufjs ship harmless postinstall steps (env
# detection / optional codegen) that pnpm blocks by default for supply-chain
# safety. Neither is required for functions to build or run correctly, but
# allow-listing them keeps `pnpm install` quiet instead of warning every time.
allowBuilds:
  '@firebase/util': true
  protobufjs: true
